name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Veraltete PR-Laeufe abbrechen, sobald ein neuer Commit kommt (spart Actions-Minuten,
# Gratis-Kontingent 2000 Min./Monat; Entscheid 2026-11-23). Laeufe auf main laufen fertig.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # PR-Merge auf main: derselbe Stand lief schon im PR, darum hier ueberspringen (spart Minuten).
    # Direkte Pushes auf main (ohne «(#NN)» im Titel) werden weiterhin getestet.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '(#')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest pytest-cov ruff==0.17.6
      # Linter blockierend (Katalog C1). ruff.toml bleibt im Arbeitsrepo (PRIVATE_ONLY im Public-Sync);
      # ohne sie wuerde der oeffentliche Klon gegen Ruffs Standardregeln laufen, darum dort ueberspringen.
      - name: ruff check
        if: hashFiles('ruff.toml') != ''
        run: ruff check .
      - name: Demo-Generator ist deterministisch
        run: python3 scripts/init_demo.py --pruefen
      - name: Generierte Dateien sind aktuell
        run: |
          bash scripts/demo.sh
          git diff --stat --exit-code
      - name: Jede NoGo-Begruendung ist woertlich in der Anzeige belegt
        run: python3 scripts/zitatcheck.py
      # Abdeckung messen und im Log zeigen (Katalog C4); vorerst ohne Schwelle. Einstellungen in .coveragerc.
      - name: Tests mit Abdeckung
        run: python3 -m pytest -q --cov --cov-report=term

  secrets:
    # PR-Merge auf main: derselbe Stand lief schon im PR, darum hier ueberspringen (spart Minuten).
    # Direkte Pushes auf main (ohne «(#NN)» im Titel) werden weiterhin getestet.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '(#')
    runs-on: ubuntu-latest
    # gitleaks-action liest bei pull_request die Commits des PRs ueber die API;
    # ohne pull-requests: read endet das mit 403 (seit den ersten PRs 2026-11-17).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
